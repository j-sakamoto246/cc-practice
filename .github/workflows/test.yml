name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day1-hn-summary

    steps:
      - uses: actions/checkout@v4

      # ShellCheck のバイナリをキャッシュ
      - name: Cache ShellCheck binary
        id: cache-shellcheck
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/shellcheck
          key: shellcheck-${{ runner.os }}-v0.10.0

      - name: Install ShellCheck
        if: steps.cache-shellcheck.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C ~/.local/bin shellcheck-v0.10.0/shellcheck
          chmod +x ~/.local/bin/shellcheck

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run ShellCheck
        working-directory: day1-hn-summary/shell
        run: shellcheck hn-top10.sh hn-summary.sh test_scripts.sh news-summary.sh test_adapters.sh lib/*.sh

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno unit tests
        run: deno task test

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sSf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \":x: CI failed on *${{ github.repository }}*\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Branch\",    \"value\": \"${{ github.ref_name }}\",   \"short\": true},
                  {\"title\": \"Commit\",    \"value\": \"${{ github.sha }}\",        \"short\": true},
                  {\"title\": \"Run URL\",   \"value\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"short\": false}
                ]
              }]
            }"
